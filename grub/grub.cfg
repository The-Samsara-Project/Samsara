#
# GRUB configuration for the Samsara micro-kernel.

set default=0
set timeout=0

# Ask for a modern linear framebuffer so the kernel's graphics console works.
# Note: GRUB under QEMU usually stays in text mode (its VBE probe finds no
# modes); the kernel's Bochs DISPI driver then switches the VGA to a linear
# 32bpp mode itself.
set gfxpayload=1024x768x32

menuentry "Samsara" {
    multiboot2 /boot/samsara.bin
    boot
}
